name: Verify Auréa Platform

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/admin-growth-crm]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test
      - run: node --check ops/console.js
      - run: node --check lib/aurea-ops-core.mjs
      - run: node --check netlify/functions/aurea-ops.mjs
      - run: node --check netlify/functions/aurea-host-login.mjs
      - run: node --check netlify/functions/aurea-ops-photo.mjs
      - run: node --check admin/app.js
      - run: node --check netlify/functions/aurea-auth.mjs
      - run: node --check netlify/functions/aurea-crm.mjs
      - run: node --check admin/outreach.js
      - run: node --check admin/sales-ui.js
      - run: node --check admin/outreach-view.js
      - run: node --check netlify/functions/aurea-activities.mjs
      - run: node --check devis/wizard.js
      - run: node --check admin/funnel-ui.js
      - run: node --check netlify/functions/aurea-funnel.mjs
      - run: node --check lib/aurea-form.mjs
      - run: node --check lib/aurea-auth.mjs
      - run: node --check admin/sales-ui.js
